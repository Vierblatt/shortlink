services:
  mysql:
    image: mysql:8.0
    container_name: golink-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: golink
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: golink-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: golink-etcd
    restart: always
    environment:
      ETCD_NAME: golink-etcd
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_CLUSTER: golink-etcd=http://0.0.0.0:2380
      ETCD_INITIAL_CLUSTER_TOKEN: golink-cluster
      ETCD_INITIAL_CLUSTER_STATE: new
      ALLOW_NONE_AUTHENTICATION: "yes"
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd_data:/etcd-data

  # Kafka 的数据卷需要先修正所有权：/tmp/kafka-logs 在镜像内并不存在，
  # 是 entrypoint 运行时创建的；Docker 首次创建命名卷时该目录归 root，
  # 而 kafka 容器以 uid=1000(appuser) 运行，会报
  # "AccessDeniedException: /tmp/kafka-logs/bootstrap.checkpoint.tmp"。
  # 这里用 alpine 预先 chown，避免让 Kafka 本身以 root 运行。
  kafka-init:
    image: alpine:3.19
    container_name: golink-kafka-init
    user: root
    command: sh -c "chown -R 1000:1000 /tmp/kafka-logs"
    volumes:
      - kafka_data:/tmp/kafka-logs
    restart: "no"

  kafka:
    image: apache/kafka:3.9.0
    container_name: golink-kafka
    restart: always
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
      # 所有客户端（link-rpc / logconsumer）都在本 compose 网络内，
      # 因此必须通告服务名。若用 localhost，客户端会被重定向到自己容器，
      # 表现为 "dial tcp [::1]:9092: connect: connection refused"。
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 单节点 broker：内部 topic 的复制因子必须为 1。
      # 否则 __consumer_offsets 无法创建，消费组协调器始终返回
      # "Group Coordinator Not Available"，logconsumer 永远消费不到消息。
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      # 经实测，apache/kafka 官方镜像在 KRaft 模式下的实际 log dir 是
      # /tmp/kafka-logs（不是 Bitnami 镜像的 /bitnami/kafka，也不是
      # config/kraft/server.properties 里写的那个）——挂错路径数据不持久。
      - kafka_data:/tmp/kafka-logs

  link-rpc:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.link
    container_name: golink-link-rpc
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_started
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./deploy/docker/config/link.yaml:/etc/link.yaml:ro
    ports:
      - "9000:9000"

  stats-rpc:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.stats
    container_name: golink-stats-rpc
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      etcd:
        condition: service_started
    volumes:
      - ./deploy/docker/config/stats.yaml:/etc/stats.yaml:ro
    ports:
      - "9001:9001"

  logconsumer:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.logconsumer
    container_name: golink-logconsumer
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
    command:
      - -dsn
      - root:${MYSQL_PASSWORD:-root123}@tcp(mysql:3306)/golink?charset=utf8mb4&parseTime=True
      - -kafka
      - kafka:9092

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.gateway
    container_name: golink-gateway
    restart: always
    depends_on:
      - link-rpc
      - etcd
    volumes:
      - ./deploy/docker/config/gateway.yaml:/etc/gateway.yaml:ro
    ports:
      - "8888:8888"

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  kafka_data:
